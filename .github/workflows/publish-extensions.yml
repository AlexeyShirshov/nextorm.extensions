name: Publish Nextorm extension packages

on:
  workflow_dispatch:

jobs:
  pack:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
      - name: Pack
        run: |
          set -euo pipefail
          for project in src/RepositoryContext/*/*.csproj src/Generators/Nextorm.Scaffold.Abstractions/*.csproj; do
            dotnet pack "$project" -c Release -o ./nupkgs
          done
          dotnet pack src/Tools/Nextorm.Scaffold -c Release -p:RuntimeIdentifiers=linux-x64 -o ./nupkgs
      - uses: actions/upload-artifact@v4
        with:
          name: extension-nupkgs
          path: nupkgs/*.nupkg
          if-no-files-found: error

  publish:
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: extension-nupkgs
          path: nupkgs
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          for package in ./nupkgs/*.nupkg; do
            dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
