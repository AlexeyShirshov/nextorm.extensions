name: Security and quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Build and audit NuGet dependencies
        shell: bash
        run: |
          set -euo pipefail
          for project in src/Generators/*/*.csproj src/RepositoryContext/*/*.csproj src/Tools/*/*.csproj tests/*/*.csproj; do
            dotnet build "$project" -c Release -warnaserror -p:NuGetAudit=true -p:NuGetAuditMode=all -p:NuGetAuditLevel=moderate
          done
      - name: Run SQLite smoke checks
        run: |
          dotnet run --project tests/SqliteSmoke/SqliteSmoke.csproj -c Release -f net10.0 --no-build
          dotnet run --project tests/SqliteSmoke/SqliteSmoke.csproj -c Release -f net11.0 --no-build
      - name: Run OData model smoke checks
        run: |
          dotnet run --project tests/ODataSmoke/ODataSmoke.csproj -c Release -f net10.0 --no-build
          dotnet run --project tests/ODataSmoke/ODataSmoke.csproj -c Release -f net11.0 --no-build
          output="$RUNNER_TEMP/ODataModels.g.cs"
          dotnet run --project src/Tools/Nextorm.Scaffold/Nextorm.Scaffold.csproj -c Release --no-build -- \
            odata-models --metadata tests/ODataSmoke/Metadata.xml --namespace Fixtures.Models --output "$output"
          tail -n +2 "$output" | diff - tests/ODataSmoke/Models.g.cs

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: none
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
